name: UTDA Phase 0 Baseline Validation
on:
  pull_request:
  push:
    branches: [main, 'setup/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install runtime and test dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run baseline schema and workflow contract tests
        run: python -m unittest discover -s tests -v
