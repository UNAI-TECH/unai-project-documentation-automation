name: UTDA reusable documentation pipeline
on:
  workflow_call:
    inputs:
      project_id:
        required: true
        type: string
      report_path:
        required: false
        type: string
        default: documentation/reports/final
    secrets:
      OPENROUTER_API_KEY:
        required: true
      GOOGLE_SERVICE_ACCOUNT_JSON:
        required: true
permissions:
  contents: read
  pull-requests: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Process event
        env:
          UTDA_PROJECT_ID: ${{ inputs.project_id }}
          UTDA_REPORT_PATH: ${{ inputs.report_path }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA: ${{ github.sha }}
          UTDA_DRY_RUN: 'true'
        run: python -m engine.trigger
