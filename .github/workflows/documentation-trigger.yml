name: UTDA documentation trigger
on:
  pull_request:
    types: [closed]
  push:
    branches: [main]
    paths:
      - 'documentation/reports/final/*.json'
      - 'documentation/project-config.json'
  workflow_dispatch:
    inputs:
      feature_id:
        description: Feature/report identifier to process
        required: true
        type: string
      dry_run:
        description: Run without mutating GitHub PRs or Google Drive
        required: false
        default: true
        type: boolean
permissions:
  contents: read
  pull-requests: read
  actions: read
concurrency:
  group: utda-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  trigger:
    if: >
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Resolve event and verify canonical JSON report
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FEATURE_ID: ${{ inputs.feature_id }}
          UTDA_AUTHORITY_MODE: GITHUB_AUTHORITY
          UTDA_MASTER_RECORD_SCOPE: BOTH
          UTDA_REGISTRY_PATH: config/project_registry.json
          UTDA_DRY_RUN: ${{ inputs.dry_run != false }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          UTDA_DATABASE_URL: ${{ secrets.UTDA_DATABASE_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_SHARED_DRIVE_ID: ${{ vars.GOOGLE_DRIVE_SHARED_DRIVE_ID }}
          UTDA_BACKUP_FOLDER_ID: ${{ vars.UTDA_BACKUP_FOLDER_ID }}
        run: python -m engine.trigger
      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: utda-run-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
