name: UTDA Database Integration CI
on:
  pull_request:
  push:
    branches: [main, 'setup/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: utda-db-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: utda_test
          POSTGRES_PASSWORD: utda_test_password
          POSTGRES_DB: utda_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL client and Python dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Verify fail-closed migration behavior when required roles are missing
        env:
          UTDA_DATABASE_URL: postgresql://utda_test:utda_test_password@localhost:5432/utda_test_db
          UTDA_DATABASE_SSLMODE: 'disable'
          UTDA_ALLOW_INSECURE_LOCAL_DB: 'true'
          UTDA_DRY_RUN: 'true'
        run: |
          if python -m engine.migrations.runner --apply; then
            echo "ERROR: migrations must fail closed when utda_migrator/utda_runtime/utda_governance roles are missing"
            exit 1
          fi
          psql "$UTDA_DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) FROM utda.schema_migrations WHERE version = '0002';" | grep -q "0"
          echo "Missing-role fail-closed check passed."
      - name: Provision least-privilege roles and apply migrations with ownership on PostgreSQL 16
        env:
          UTDA_DATABASE_URL: postgresql://utda_test:utda_test_password@localhost:5432/utda_test_db
          UTDA_DATABASE_SSLMODE: 'disable'
          UTDA_ALLOW_INSECURE_LOCAL_DB: 'true'
          UTDA_DRY_RUN: 'true'
        run: |
          psql "$UTDA_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE utda_migrator NOINHERIT LOGIN PASSWORD 'mig_pw_test';"
          psql "$UTDA_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE utda_runtime NOINHERIT LOGIN PASSWORD 'run_pw_test';"
          psql "$UTDA_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE utda_governance NOINHERIT LOGIN PASSWORD 'gov_pw_test';"
          psql "$UTDA_DATABASE_URL" -v ON_ERROR_STOP=1 -c "GRANT utda_migrator TO utda_test;"
          psql "$UTDA_DATABASE_URL" -v ON_ERROR_STOP=1 -c "REVOKE CREATE ON SCHEMA public FROM utda_runtime, utda_governance;"
          python -m engine.migrations.runner --plan
          python -m engine.migrations.runner --apply
          python -m engine.db_health --json
      - name: Run full Phase 0 and Phase 1 security and integration tests against PostgreSQL 16
        env:
          UTDA_TEST_DATABASE_URL: postgresql://utda_test:utda_test_password@localhost:5432/utda_test_db
          UTDA_TEST_RUNTIME_URL: postgresql://utda_runtime:run_pw_test@localhost:5432/utda_test_db
          UTDA_TEST_MIGRATOR_URL: postgresql://utda_migrator:mig_pw_test@localhost:5432/utda_test_db
          UTDA_TEST_GOVERNANCE_URL: postgresql://utda_governance:gov_pw_test@localhost:5432/utda_test_db
          UTDA_DATABASE_SSLMODE: 'disable'
          UTDA_ALLOW_INSECURE_LOCAL_DB: 'true'
          UTDA_DRY_RUN: 'true'
        run: python -m pytest -v -rs
      - name: Verify pg_dump backup and pg_restore recovery on PostgreSQL 16
        env:
          ADMIN_DSN: postgresql://utda_test:utda_test_password@localhost:5432/utda_test_db
          RESTORE_DSN: postgresql://utda_test:utda_test_password@localhost:5432/utda_restore_verify
        run: |
          docker run --rm --network host -v "$PWD:/work" -w /work postgres:16-alpine pg_dump --version
          docker run --rm --network host -v "$PWD:/work" -w /work postgres:16-alpine pg_dump --format=custom --schema=utda --no-owner --no-privileges "$ADMIN_DSN" -f utda_ci_backup.dump
          psql "$ADMIN_DSN" -v ON_ERROR_STOP=1 -c "CREATE DATABASE utda_restore_verify;"
          docker run --rm --network host -v "$PWD:/work" -w /work postgres:16-alpine pg_restore --exit-on-error --dbname="$RESTORE_DSN" --no-owner --no-privileges utda_ci_backup.dump
          UTDA_DATABASE_URL="$RESTORE_DSN" UTDA_DATABASE_SSLMODE=disable UTDA_ALLOW_INSECURE_LOCAL_DB=true python -m engine.db_health --json
          rm -f utda_ci_backup.dump
      - name: Verify read-only Supabase probe defaults cleanly to pending when unset
        run: python -m engine.db_health --readonly-verify --json
