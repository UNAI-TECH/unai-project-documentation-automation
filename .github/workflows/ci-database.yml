name: UTDA Database Integration CI
on:
  pull_request:
  push:
    branches: [main, 'setup/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: utda-db-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: utda_test
          POSTGRES_PASSWORD: utda_test_password
          POSTGRES_DB: utda_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL 16 client and Python dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Create least-privilege roles and run migrations against PostgreSQL 16
        env:
          UTDA_DATABASE_URL: postgresql://utda_test:utda_test_password@localhost:5432/utda_test_db
          UTDA_DATABASE_SSLMODE: 'disable'
          UTDA_ALLOW_INSECURE_LOCAL_DB: 'true'
          UTDA_DRY_RUN: 'true'
        run: |
          psql "$UTDA_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE utda_migrator NOINHERIT LOGIN PASSWORD 'mig_pw_test';"
          psql "$UTDA_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE utda_runtime NOINHERIT LOGIN PASSWORD 'run_pw_test';"
          python -m engine.migrations.runner --plan
          python -m engine.migrations.runner --apply
          python -m engine.db_health --json
      - name: Verify least-privilege role enforcement on PostgreSQL 16
        env:
          RUNTIME_DSN: postgresql://utda_runtime:run_pw_test@localhost:5432/utda_test_db
        run: |
          psql "$RUNTIME_DSN" -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM utda.schema_migrations;"
          psql "$RUNTIME_DSN" -v ON_ERROR_STOP=1 -c "INSERT INTO utda.audit_events (event_id, actor, event_type) VALUES ('ci-priv-test', 'ci', 'PRIV_CHECK');"
          if psql "$RUNTIME_DSN" -v ON_ERROR_STOP=1 -c "DELETE FROM utda.audit_events;" 2>/dev/null; then
            echo "ERROR: utda_runtime must not be allowed to DELETE from utda.audit_events"
            exit 1
          fi
          if psql "$RUNTIME_DSN" -v ON_ERROR_STOP=1 -c "UPDATE utda.audit_events SET actor='tamper';" 2>/dev/null; then
            echo "ERROR: utda_runtime must not be allowed to UPDATE utda.audit_events"
            exit 1
          fi
          if psql "$RUNTIME_DSN" -v ON_ERROR_STOP=1 -c "CREATE TABLE utda.illegal_table (id int);" 2>/dev/null; then
            echo "ERROR: utda_runtime must not be allowed to CREATE tables in utda"
            exit 1
          fi
          echo "Least-privilege role verification passed."
      - name: Run full Phase 0 and Phase 1 test suite against PostgreSQL 16
        env:
          UTDA_TEST_DATABASE_URL: postgresql://utda_test:utda_test_password@localhost:5432/utda_test_db
          UTDA_DATABASE_SSLMODE: 'disable'
          UTDA_ALLOW_INSECURE_LOCAL_DB: 'true'
          UTDA_DRY_RUN: 'true'
        run: python -m pytest -v -rs
      - name: Verify pg_dump backup and pg_restore recovery on PostgreSQL 16
        env:
          ADMIN_DSN: postgresql://utda_test:utda_test_password@localhost:5432/utda_test_db
          RESTORE_DSN: postgresql://utda_test:utda_test_password@localhost:5432/utda_restore_verify
        run: |
          pg_dump --version
          pg_dump --format=custom --schema=utda --no-owner --no-privileges "$ADMIN_DSN" -f utda_ci_backup.dump
          psql "$ADMIN_DSN" -v ON_ERROR_STOP=1 -c "CREATE DATABASE utda_restore_verify;"
          pg_restore --exit-on-error --dbname="$RESTORE_DSN" --no-owner --no-privileges utda_ci_backup.dump
          UTDA_DATABASE_URL="$RESTORE_DSN" UTDA_DATABASE_SSLMODE=disable UTDA_ALLOW_INSECURE_LOCAL_DB=true python -m engine.db_health --json
          rm -f utda_ci_backup.dump
      - name: Verify read-only Supabase probe defaults cleanly to pending when unset
        run: python -m engine.db_health --readonly-verify --json
