name: UTDA Database Integration CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: utda-db-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: utda_test
          POSTGRES_PASSWORD: utda_test_password
          POSTGRES_DB: utda_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run Phase 0 and Phase 1 database tests against local PostgreSQL
        env:
          UTDA_TEST_DATABASE_URL: postgresql://utda_test:utda_test_password@localhost:5432/utda_test_db
          UTDA_ALLOW_INSECURE_LOCAL_DB: 'true'
          UTDA_DRY_RUN: 'true'
        run: python -m unittest discover -s tests -v
